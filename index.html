<!DOCTYPE html>
<!-- Declara que o documento usa HTML5 -->
<html lang="pt-BR">
<!-- Início do documento, idioma português do Brasil -->
<head>
    <!-- Cabeçalho: informações que não aparecem no corpo da página -->
    <meta charset="UTF-8">
    <!-- Codificação que permite acentos e ç -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Deixa a página responsiva em celulares -->
    <title>Meus sites favoritos</title>
    <!-- Título que aparece na aba do navegador -->
    <style>
        /* Estilo geral da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            color: #222;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        /* Título principal do corpo */
        h2 {
            color: #2d3a8c;
            margin-bottom: 30px;
        }
        /* Cada site fica dentro de um cartão */
        .site {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            max-width: 420px;
            margin: 0 auto 25px auto;
            padding: 15px;
        }
        /* Nome do site */
        .site h1 {
            font-size: 24px;
            margin: 5px 0 12px 0;
        }
        /* Imagem do site */
        .site img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        /* Link abaixo da imagem */
        .site a {
            display: inline-block;
            margin-top: 10px;
            color: #2d3a8c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Corpo: tudo o que aparece na página -->

    <h2>Meus sites favoritos: Thaina Rodrigues de Almeida</h2>
    <!-- Título do corpo da página com o nome -->

    <!-- ===== SITE 1 ===== -->
    <div class="site">
        <h1>YouTube</h1>
        <!-- Nome do site acima da imagem -->
        <a href="https://www.youtube.com" target="_blank">
            <img src="imagens/youtube.png" alt="Captura de tela do site YouTube">
        </a>
        <!-- Imagem local (pasta imagens) clicável (opcional) -->
        <br>
        <a href="https://www.youtube.com" target="_blank">https://www.youtube.com</a>
        <!-- Link abaixo da imagem -->
    </div>

    <!-- ===== SITE 2 ===== -->
    <div class="site">
        <h1>GitHub</h1>
        <a href="https://github.com" target="_blank">
            <img src="imagens/github.png" alt="Captura de tela do site GitHub">
        </a>
        <br>
        <a href="https://github.com" target="_blank">https://github.com</a>
    </div>

    <!-- ===== SITE 3 ===== -->
    <div class="site">
        <h1>Canva</h1>
        <a href="https://www.canva.com" target="_blank">
            <img src="imagens/canva.png" alt="Captura de tela do site Canva">
        </a>
        <br>
        <a href="https://www.canva.com" target="_blank">https://www.canva.com</a>
    </div>

    <!-- ===== SITE 4 ===== -->
    <div class="site">
        <h1>PubMed (NCBI)</h1>
        <a href="https://pubmed.ncbi.nlm.nih.gov" target="_blank">
            <img src="imagens/pubmed.png" alt="Captura de tela do site PubMed (NCBI)">
        </a>
        <br>
        <a href="https://pubmed.ncbi.nlm.nih.gov" target="_blank">https://pubmed.ncbi.nlm.nih.gov</a>
    </div>

    <!-- ===== SITE 5 ===== -->
    <div class="site">
        <h1>Google Acadêmico</h1>
        <a href="https://scholar.google.com.br" target="_blank">
            <img src="imagens/google-academico.png" alt="Captura de tela do site Google Acadêmico">
        </a>
        <br>
        <a href="https://scholar.google.com.br" target="_blank">https://scholar.google.com.br</a>
    </div>

</body>
<!-- Fim do corpo -->
</html>
<!-- Fim do documento -->
